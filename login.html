<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Pikora</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 24px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:

                radial-gradient(
                    circle at 15% 15%,
                    rgba(137, 92, 255, 0.28),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 85% 85%,
                    rgba(83, 220, 214, 0.16),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 50% 0%,
                    rgba(102, 72, 180, 0.12),
                    transparent 35%
                ),

                #09090f;

            overflow-x: hidden;

        }


        /* =========================
           BACKGROUND GLOW
        ========================= */

        body::before {

            content: "";

            position: fixed;

            width: 280px;

            height: 280px;

            border-radius: 50%;

            background:
                rgba(155, 124, 255, 0.08);

            filter: blur(80px);

            top: 10%;

            left: 50%;

            transform:
                translateX(-50%);

            pointer-events: none;

        }


        /* =========================
           LOGIN CARD
        ========================= */

        .login-box {

            width: 100%;

            max-width: 430px;

            padding: 42px 38px;

            border-radius: 28px;

            background:
                rgba(255,255,255,0.055);

            border:
                1px solid
                rgba(255,255,255,0.10);

            backdrop-filter:
                blur(24px);

            -webkit-backdrop-filter:
                blur(24px);

            box-shadow:

                0 30px 90px
                rgba(0,0,0,0.45),

                inset 0 1px 0
                rgba(255,255,255,0.05);

            animation:
                cardAppear
                0.7s ease;

        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(18px)
                    scale(0.98);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* =========================
           LOGO
        ========================= */

        .logo-wrapper {

            text-align: center;

            margin-bottom: 35px;

        }


        .logo {

            font-size: 30px;

            font-weight: 700;

            letter-spacing: -0.8px;

        }


        .logo span {

            color: #9b7cff;

        }


        .tagline {

            margin-top: 7px;

            font-size: 12px;

            color: #777587;

            letter-spacing: 0.4px;

        }


        /* =========================
           TITLE
        ========================= */

        h1 {

            font-size: 29px;

            line-height: 1.25;

            letter-spacing: -0.5px;

            margin-bottom: 10px;

        }


        .description {

            color: #9997a8;

            font-size: 14px;

            line-height: 1.7;

            margin-bottom: 30px;

        }


        /* =========================
           FORM
        ========================= */

        .field {

            margin-bottom: 19px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            color: #c8c5d2;

        }


        .input-wrapper {

            position: relative;

        }


        input {

            width: 100%;

            padding: 14px 15px;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,255,255,0.10);

            outline: none;

            background:
                rgba(255,255,255,0.045);

            color: white;

            font-size: 14px;

            transition:
                border 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;

        }


        input::placeholder {

            color: #626171;

        }


        input:focus {

            border-color:
                rgba(155,124,255,0.8);

            background:
                rgba(255,255,255,0.065);

            box-shadow:
                0 0 0 3px
                rgba(155,124,255,0.08);

        }


        /* =========================
           PASSWORD TOGGLE
        ========================= */

        .password-toggle {

            position: absolute;

            right: 13px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color: #777587;

            width: auto;

            padding: 5px;

            font-size: 12px;

            cursor: pointer;

        }


        .password-toggle:hover {

            color: #b9a9ff;

            opacity: 1;

        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-button {

            width: 100%;

            margin-top: 7px;

            padding: 15px;

            border: none;

            border-radius: 13px;

            background:

                linear-gradient(
                    135deg,
                    #a88cff,
                    #725ce6
                );

            color: white;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: 0.2px;

            cursor: pointer;

            box-shadow:

                0 10px 25px
                rgba(120, 91, 230, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;

        }


        .login-button:hover {

            transform:
                translateY(-2px);

            box-shadow:

                0 14px 30px
                rgba(120, 91, 230, 0.32);

        }


        .login-button:active {

            transform:
                translateY(0);

        }


        /* =========================
           REGISTER
        ========================= */

        .register {

            text-align: center;

            margin-top: 25px;

            color: #777587;

            font-size: 13px;

        }


        .register a {

            color: #a991ff;

            text-decoration: none;

            font-weight: 600;

            margin-left: 4px;

        }


        .register a:hover {

            color: #c1b2ff;

        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            text-align: center;

            margin-top: 25px;

            font-size: 11px;

            color: #4f4d59;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            body {

                padding: 16px;

            }


            .login-box {

                padding:
                    34px 24px;

                border-radius: 23px;

            }


            .logo {

                font-size: 27px;

            }


            h1 {

                font-size: 25px;

            }

        }

    </style>

</head>


<body>


    <div class="login-box">


        <!-- LOGO -->

        <div class="logo-wrapper">

            <div class="logo">

                Pi<span>kora</span>

            </div>

            <div class="tagline">

                where thoughts find a home

            </div>

        </div>


        <!-- TITLE -->

        <h1>

            Selamat datang kembali

        </h1>


        <p class="description">

            Masuk ke ruang pribadimu dan
            lanjutkan cerita yang belum selesai.

        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- EMAIL -->

            <div class="field">

                <label for="email">

                    Email

                </label>

                <div class="input-wrapper">

                    <input
                        id="email"
                        type="email"
                        placeholder="nama@email.com"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="password">

                    Password

                </label>

                <div class="input-wrapper">

                    <input
                        id="password"
                        type="password"
                        placeholder="Password kamu"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                    >
                        Lihat
                    </button>

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-button"
            >

                Masuk ke Pikora

            </button>


        </form>


        <!-- REGISTER -->

        <div class="register">

            Belum punya akun?

            <a href="register.html">

                Buat akun

            </a>

        </div>


        <div class="footer">

            Pikora © 2026

        </div>


    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        /* =========================
           SUPABASE CONFIG
        ========================= */

        const SUPABASE_URL =
            "https://gcaztzukpotpsdkcjkwn.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_WxAteQaZ4GOUrNc9Y5bg_aq6UlgS9";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =========================
           PASSWORD TOGGLE
        ========================= */

        const passwordInput =
            document.getElementById(
                "password"
            );


        const togglePassword =
            document.getElementById(
                "togglePassword"
            );


        togglePassword.addEventListener(
            "click",
            function() {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    togglePassword.textContent =
                        "Sembunyikan";

                }

                else {

                    passwordInput.type =
                        "password";

                    togglePassword.textContent =
                        "Lihat";

                }

            }
        );


        /* =========================
           LOGIN
        ========================= */

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const email =
                        document
                            .getElementById(
                                "email"
                            )
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById(
                                "password"
                            )
                            .value;


                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signInWithPassword({

                                email:
                                    email,

                                password:
                                    password

                            });


                    if (error) {

                        alert(
                            "Login gagal: " +
                            error.message
                        );

                        return;

                    }


                    alert(
                        "Login berhasil!"
                    );


                    window.location.href =
                        "index.html";

                }
            );


    </script>


</body>

</html>
