<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - RuangPikiran</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at top left,
                    #27204a,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #172f45,
                    transparent 35%
                ),
                #0d0d14;
        }

        .login-box {
            width: 100%;
            max-width: 430px;

            padding: 35px;

            border-radius: 22px;

            background: rgba(255,255,255,0.06);

            border:
                1px solid
                rgba(255,255,255,0.1);

            backdrop-filter: blur(15px);

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.35);
        }

        .logo {
            text-align: center;

            font-size: 26px;

            font-weight: bold;

            margin-bottom: 35px;
        }

        .logo span {
            color: #9b7cff;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .description {
            color: #9997a8;

            line-height: 1.6;

            margin-bottom: 28px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            color: #c7c5d0;
        }

        input {
            width: 100%;

            padding: 14px 15px;

            margin-bottom: 18px;

            border-radius: 10px;

            border:
                1px solid
                rgba(255,255,255,0.1);

            outline: none;

            background:
                rgba(255,255,255,0.05);

            color: white;

            font-size: 15px;
        }

        input:focus {
            border-color: #9b7cff;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #9b7cff,
                    #6d5ce7
                );

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .register {
            text-align: center;

            margin-top: 22px;

            color: #888697;

            font-size: 14px;
        }

        .register a {
            color: #9b7cff;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>


<body>


    <div class="login-box">

        <div class="logo">
            Ruang<span>Pikiran</span>
        </div>


        <h1>
            Selamat datang kembali
        </h1>


        <p class="description">
            Masuk untuk melanjutkan ke ruang
            pikiranmu.
        </p>


        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="nama@email.com"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Password kamu"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <div class="register">

            Belum punya akun?

            <a href="register.html">
                Buat akun
            </a>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://gcaztzukpotpsdkcjkwn.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_WxAteQaZ4GOUrNcZy9Y5bg_aq6UlgS9";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signInWithPassword({

                                email: email,

                                password: password

                            });


                    if (error) {

                        alert(
                            "Login gagal: " +
                            error.message
                        );

                        return;
                    }


                    alert(
                        "Login berhasil!"
                    );


                    window.location.href =
                        "arphille.html";

                }
            );

    </script>


</body>

</html>
